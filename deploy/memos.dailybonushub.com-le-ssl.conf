# /etc/apache2/sites-available/memos.dailybonushub.com-le-ssl.conf
#
# 这是 certbot --apache 自动生成后的样子（供你核对/手动配置参考）。
# 如果用 certbot 自动签发，通常不需要手工写这个文件，certbot 会帮你生成并改好。
# 证书路径按你实际签发结果为准。

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName memos.dailybonushub.com

    ProxyPreserveHost On
    ProxyRequests Off

    # 反代到容器暴露的 8811 端口（docker-compose.yml 里映射的端口）
    ProxyPass / http://127.0.0.1:8811/
    ProxyPassReverse / http://127.0.0.1:8811/

    # 传递真实客户端信息给后端（FastAPI 可通过这些头识别原始请求）
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    SSLCertificateFile /etc/letsencrypt/live/memos.dailybonushub.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/memos.dailybonushub.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog ${APACHE_LOG_DIR}/memos_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/memos_ssl_access.log combined
</VirtualHost>
</IfModule>

# HTTP 自动跳转 HTTPS（certbot 通常也会自动加到 80 端口配置里）
<VirtualHost *:80>
    ServerName memos.dailybonushub.com
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =memos.dailybonushub.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
