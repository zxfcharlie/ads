# /etc/apache2/sites-available/memos.dailybonushub.com.conf
#
# 部署说明见同目录 README-deploy.md
# 第一阶段：先用这个 HTTP 配置跑通，再用 certbot 自动升级出 HTTPS 版本

<VirtualHost *:80>
    ServerName memos.dailybonushub.com

    # certbot --apache 验证域名归属需要用到 .well-known 路径
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8811/
    ProxyPassReverse / http://127.0.0.1:8811/

    ErrorLog ${APACHE_LOG_DIR}/memos_error.log
    CustomLog ${APACHE_LOG_DIR}/memos_access.log combined
</VirtualHost>
